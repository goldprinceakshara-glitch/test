<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Summary - Stock Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- PWA & Web App Icon Setup -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOLDPRINCE">
<meta name="theme-color" content="#900143">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="GOLDPRINCE">
<script src="config.js"></script>
<script src="gp-sync.js"></script>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-chart-pie"></i> Category wise Total Quantity & Weight</h1>

    <div class="card">
        <div class="section-header">
            <h2><i class="fas fa-list"></i> Summary by Category</h2>
            <button class="outline" onclick="exportSummary()"><i class="fas fa-file-export"></i> Export</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Total Quantity</th>
                        <th>Total Weight (g)</th>
                        <th>Art Numbers</th>
                    </tr>
                </thead>
                <tbody id="categoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<script src="data.js"></script>
<script src="categorySummary.js"></script>
</body>
</html>
