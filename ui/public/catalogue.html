<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Stock Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- PWA & Web App Icon Setup -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GOLDPRINCE">
    <meta name="theme-color" content="#900143">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="GOLDPRINCE">

    <!-- Libraries for PDF & Excel export with images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-book"></i> Catalogue Management</h1>

    <div class="card">
        <div class="section-header">
            <h2><i class="fas fa-list"></i> Product Catalogue</h2>
            <div class="actions">
                <button onclick="openAddModal()"><i class="fas fa-plus"></i> Add Product</button>
                <button class="outline" id="detailsToggleBtn" onclick="toggleCatalogueDetails()">
                    <i class="fas fa-eye"></i> Details
                </button>
            </div>
        </div>

        <!-- ================= COLLAPSIBLE DETAILS SECTION ================= -->
        <div id="catalogueDetails" style="display:none;">

            <!-- Filter + export toolbar -->
            <div class="form-row" style="margin-bottom:18px; align-items:flex-end;">
                <div class="form-group" style="flex:1 1 200px; min-width:160px;">
                    <label>Product Name</label>
                    <input type="text" id="filterName" placeholder="Search product name / art no">
                </div>
                <div class="form-group" style="flex:1 1 160px; min-width:140px;">
                    <label>Category</label>
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option value="3D Idols">3D Idols</option>
                        <option value="3D Premium Idols">3D Premium Idols</option>
                        <option value="2D Idols">2D Idols</option>
                        <option value="Jewellery">Jewellery</option>
                        <option value="God frames">God frames</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1 1 160px; min-width:140px;">
                    <label>Product Group</label>
                    <select id="filterGroup">
                        <option value="">All Groups</option>
                        <option value="Antique">Antique</option>
                        <option value="Premium">Premium</option>
                        <option value="GJ">GJ</option>
                        <option value="Kundan">Kundan</option>
                        <option value="Gatti">Gatti</option>
                        <option value="Meenakari">Meenakari</option>
                    </select>
                </div>
                <div class="form-group" style="flex:0 0 auto;">
                    <label>&nbsp;</label>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button class="outline" onclick="clearFilters()"><i class="fas fa-times"></i> Clear</button>
                        <button class="outline" onclick="downloadFilteredPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
                        <button class="outline" onclick="downloadFilteredExcel()"><i class="fas fa-file-excel"></i> Excel</button>
                    </div>
                </div>
            </div>

            <!-- Bulk import / export toolbar -->
            <div class="actions" style="margin-bottom:15px;">
                <button class="outline" onclick="downloadCatalogueTemplate()"><i class="fas fa-download"></i> Template</button>
                <button class="outline" onclick="document.getElementById('catalogueExcelInput').click()"><i class="fas fa-file-import"></i> Import Excel</button>
                <button class="outline" onclick="exportCatalogue()"><i class="fas fa-file-export"></i> Export CSV</button>
            </div>
            <input type="file" id="catalogueExcelInput" accept=".csv,.xlsx,.xls" style="display:none;">

            <!-- Table -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Art No</th>
                            <th>Product Name</th>
                            <th>Avg Weight (g)</th>
                            <th>Category</th>
                            <th>Product Group</th>
                            <th>Size (inch)</th>
                            <th>Image</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="catalogueBody"></tbody>
                </table>
            </div>

            <div class="summary-stats" style="margin-top:20px;">
                <div class="stat"><span>Total Products</span><strong id="totalProducts">0</strong></div>
                <div class="stat green"><span>Showing</span><strong id="filteredProducts">0</strong></div>
            </div>
        </div>
        <!-- ================= /COLLAPSIBLE DETAILS SECTION ================= -->

    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="catalogueModal">
    <div class="modal">
        <h2 id="modalTitle">Add Product</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Art Number *</label>
                <input type="text" id="fArt" placeholder="e.g., A101">
            </div>
            <div class="form-group">
                <label>Product Name *</label>
                <input type="text" id="fName" placeholder="Product name">
            </div>
            <div class="form-group">
                <label>Average Weight (g)</label>
                <input type="number" id="fAvgWeight" step="0.01" value="0">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="fCategory">
                    <option value="3D Idols">3D Idols</option>
                    <option value="3D Premium Idols">3D Premium Idols</option>
                    <option value="2D Idols">2D Idols</option>
                    <option value="Jewellery">Jewellery</option>
                    <option value="God frames">God frames</option>
                </select>
            </div>
            <div class="form-group">
                <label>Product Group</label>
                <select id="fGroup">
                    <option value="Antique">Antique</option>
                    <option value="Premium">Premium</option>
                    <option value="GJ">GJ</option>
                    <option value="Kundan">Kundan</option>
                    <option value="Gatti">Gatti</option>
                    <option value="Meenakari">Meenakari</option>
                </select>
            </div>
            <div class="form-group">
                <label>Size (inch)</label>
                <input type="text" id="fSize" placeholder="e.g., 6">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Image (URL or Upload)</label>
                <input type="text" id="fImage" placeholder="Image URL" style="margin-bottom:8px;">
                <input type="file" id="fImageFile" accept="image/*">
            </div>
        </div>
        <div class="actions" style="margin-top: 20px;">
            <button class="outline" onclick="closeModal()">Cancel</button>
            <button onclick="saveProduct()"><i class="fas fa-save"></i> Save</button>
        </div>
    </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<script src="data.js"></script>
<script src="catalogue.js"></script>
</body>
</html>
