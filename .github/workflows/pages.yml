
name: Deploy GP Portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend
        run: |
          test -f ui/public/index.html || {
            echo "ERROR: ui/public/index.html is missing"
            exit 1
          }

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -a ui/public/. _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in Path("_site").glob("*.html"):
              html = page.read_text(encoding="utf-8")
              if "cloud-sync.js" not in html:
                  html, count = re.subn(
                      r"</head>",
                      '<script src="cloud-sync.js"></script>\\n</head>',
                      html,
                      count=1,
                      flags=re.IGNORECASE,
                  )
                  if count != 1:
                      raise SystemExit(f"Could not add shared-data bridge to {page}")
                  page.write_text(html, encoding="utf-8")
          PY

      - name: Validate application JavaScript
        run: |
          node --check api/server.js
          node --check ui/public/cloud-sync.js

      - name: Configure Railway API
        env:
          RAILWAY_URL: https://test-production-313c31af.up.railway.app
        run: |
          URL="${RAILWAY_URL:-https://test-production-313c31af.up.railway.app}"
          printf 'window.GP_API_BASE = "%s";\n' "${URL%/}" > _site/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
