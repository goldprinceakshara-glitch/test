
name: Deploy GP Portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend
        run: |
          test -f ui/public/index.html || {
            echo "ERROR: ui/public/index.html is missing"
            exit 1
          }

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -a ui/public/. _site/
          touch _site/.nojekyll

      - name: Configure Railway API
        env:
          RAILWAY_URL: https://test-production-313c31af.up.railway.app
        run: |
          URL="${RAILWAY_URL:-https://test-production-313c31af.up.railway.app}"
          printf 'window.GP_API_BASE = "%s";\n' "${URL%/}" > _site/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
