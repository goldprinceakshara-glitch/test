<script>
(function () {
  if (window.__GP_LOGGING_OUT__) return;
  function checkSession() {
    var s = null;
    try { s = JSON.parse(sessionStorage.getItem('gp_logged_user') || 'null'); } catch (e) {}
    if (!s || !s.username) {
      try { sessionStorage.clear(); } catch (e) {}
      window.location.replace('index.html?t=' + Date.now());
      return false;
    }
    if (s.role !== 'user') {
      if (s.role === 'admin')    { window.location.replace('gpadmin.html');     return false; }
      if (s.role === 'workshop') { window.location.replace('gpwork-shop.html'); return false; }
      try { sessionStorage.clear(); } catch (e) {}
      window.location.replace('index.html?t=' + Date.now());
      return false;
    }
    return true;
  }
  if (!checkSession()) return;
  window.addEventListener('pageshow', function () { checkSession(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkSession();
  });
  window.addEventListener('focus', function () { checkSession(); });
})();
</script>

<script>
var logged = null;
try { logged = JSON.parse(sessionStorage.getItem('gp_logged_user') || 'null'); } catch (e) {}
if (logged && logged.username) document.getElementById('userName').textContent = logged.username;

document.getElementById('logoutBtn').addEventListener('click', function () {
  if (!confirm('Log out of GP Portal?')) return;
  window.__GP_LOGGING_OUT__ = true;
  try { sessionStorage.clear(); } catch (e) {}
  var target = 'index.html?t=' + Date.now() + '&logout=1';
  window.location.href = target;
  setTimeout(function () {
    if (window.location.pathname.indexOf('index.html') === -1) window.location.replace(target);
  }, 50);
});

// ---------- HELPERS ----------
function showToast(msg, type = '') {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMsg';
        toast.className = 'toast-msg';
        document.body.appendChild(toast);
    }
    toast.className = 'toast-msg ' + type;
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function exportToCSV(filename, headers, rows) {
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
        csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported successfully', 'success');
}

function parseCSV(text) {
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) return [];
    const firstLine = lines[0].replace(/^\uFEFF/, '');
    const headers = firstLine.split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
        const clean = values.map(v => v.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
        const row = {};
        headers.forEach((h, idx) => { row[h] = clean[idx] || ''; });
        rows.push(row);
    }
    return rows;
}

function buildNavbar() {
    const currentPage = window.location.pathname.split('/').pop() || 'stock index.html';
    const links = [
        { href: 'stock index.html',  label: 'Home',      icon: 'fa-home' },
        { href: 'catalogue.html',    label: 'Catalogue', icon: 'fa-book' },
        { href: 'opening-stock.html',label: 'Orders',    icon: 'fa-archive' },
    ];
    const nav = document.createElement('div');
    nav.className = 'navbar';
    nav.innerHTML = `
        <div class="brand"><i class="fas fa-boxes"></i> Stock Inventory</div>
        <div class="nav-links">
            ${links.map(l => `
                <a href="${l.href}" class="${currentPage === l.href ? 'active' : ''}">
                    <i class="fas ${l.icon}"></i> ${l.label}
                </a>
            `).join('')}
        </div>
    `;
    document.body.insertBefore(nav, document.body.firstChild);
}

/* MOBILE: tap-to-open mega-menu */
(function () {
  function isMobileNav() { return window.innerWidth <= 900; }
  document.querySelectorAll('.menu_bar > ul > li').forEach(function (li) {
    var directLink = li.querySelector(':scope > a');
    if (!directLink) return;
    var hasSub = li.querySelector('.dropdown_menu, .dropdown_menu-1');
    if (!hasSub) return;
    directLink.addEventListener('click', function (e) {
      if (!isMobileNav()) return;
      e.preventDefault();
      e.stopPropagation();
      li.classList.toggle('open');
    });
  });
})();
</script>
